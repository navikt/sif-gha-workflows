name: Test sif-code-scan action
on:
  push:
    paths:
      - '.github/actions/sif-code-scan/**'
      - 'tests/sif-code-scan/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6.4.0
        with:
          node-version: 24
      - name: Run tests
        working-directory: .github/actions/sif-code-scan
        run: npm ci --ignore-scripts && npm test
