name: Test sif-code-scan action
on:
  push:
    paths:
      - '.github/actions/sif-code-scan/**'
      - 'tests/sif-code-scan/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Run tests
        working-directory: .github/actions/sif-code-scan
        run: npm ci --ignore-scripts && npm test
