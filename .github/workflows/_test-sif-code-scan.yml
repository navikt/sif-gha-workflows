name: Test sif-code-scan action
on:
  push:
    paths:
      - '.github/actions/sif-code-scan/**'
      - 'tests/sif-code-scan/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6.4.0
        with:
          node-version: 24
      - name: Run tests
        working-directory: .github/actions/sif-code-scan
        run: npm ci --ignore-scripts && npm test
