name: SIF Code Scan
description: Scans repository for sensitive data like Norwegian national identity numbers (fødselsnummer). Only FNR from the bundled allowed-fnr lists are allowed.

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
      with:
        node-version: 24
    - name: Scan for sensitive data
      shell: bash
      run: |
        npm --prefix "${{ github.action_path }}" ci --ignore-scripts --omit=dev --silent
        node "${{ github.action_path }}/scan.ts"
